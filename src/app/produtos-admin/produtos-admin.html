
<section class="produtos-admin">

  <div class="titulo">
    <h1>Gerenciamento de Produtos</h1>
    <p>Cadastre e gerencie os produtos da loja.</p>
  </div>

  <div class="formulario">
    <h2>Cadastrar produto</h2>

    <form>

      <div class="campo">
        <label>Nome do produto</label>
        <input
          type="text"
          name="nome"
          [(ngModel)]="novoProduto.nome"
          placeholder="Digite o nome do produto">
      </div>

      <div class="campo">
        <label>Descrição</label>
        <textarea
          name="descricao"
          [(ngModel)]="novoProduto.descricao"
          placeholder="Digite a descrição do produto">
        </textarea>
      </div>

      <div class="campo">
        <label>Preço</label>
        <input
          type="number"
          name="preco"
          [(ngModel)]="novoProduto.preco"
          placeholder="0,00">
      </div>

      <div class="campo">
        <label>Quantidade em estoque</label>
        <input
          type="number"
          name="quantidade"
          [(ngModel)]="novoProduto.quantidade"
          placeholder="Digite a quantidade">
      </div>

      <button type="button" (click)="cadastrarProduto()">
        Cadastrar produto
      </button>

    </form>
  </div>

  <div class="lista-produtos">

    <h2>Produtos cadastrados</h2>

    <p *ngIf="produtos.length === 0">
      Nenhum produto cadastrado ainda.
    </p>

    <div class="produto" *ngFor="let produto of produtos; let i = index">

      <h3>{{ produto.nome }}</h3>
    
      <p>{{ produto.descricao }}</p>
    
      <p>Preço: {{ produto.preco | currency:'BRL' }}</p>
    
      <p>Estoque: {{ produto.quantidade }}</p>
    
      <button type="button" (click)="editarProduto(i)">
        Editar produto
      </button>
      
      <button type="button" (click)="excluirProduto(i)">
        Excluir produto
      </button>
    
    </div>

  </div>

</section>
