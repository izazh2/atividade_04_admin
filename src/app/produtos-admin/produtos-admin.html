<section class="produtos-admin">

    <div class="titulo">
      <h1>Gerenciamento de Produtos</h1>
      <p>Cadastre e gerencie os produtos da loja.</p>
    </div>
  
    <div class="formulario">
      <h2>Cadastrar produto</h2>
  
      <form>
        <div class="campo">
          <label>Nome do produto</label>
          <input type="text" placeholder="Digite o nome do produto">
        </div>
  
        <div class="campo">
          <label>Descrição</label>
          <textarea placeholder="Digite a descrição do produto"></textarea>
        </div>
  
        <div class="campo">
          <label>Preço</label>
          <input type="number" placeholder="0,00">
        </div>
  
        <div class="campo">
          <label>Quantidade em estoque</label>
          <input type="number" placeholder="Digite a quantidade">
        </div>
  
        <button type="button">Cadastrar produto</button>
      </form>
    </div>
  
    <div class="lista-produtos">
      <h2>Produtos cadastrados</h2>
      <p>Nenhum produto cadastrado ainda.</p>
    </div>
  
  </section>
