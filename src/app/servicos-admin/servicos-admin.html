<section class="servicos-admin">

    <div class="titulo">
      <h1>Gerenciamento de Serviços</h1>
      <p>Cadastre e gerencie os serviços oferecidos pela estética.</p>
    </div>
  
    <div class="formulario">
      <h2>Cadastrar serviço</h2>
  
      <form>
        <div class="campo">
          <label>Nome do serviço</label>
          <input type="text" placeholder="Digite o nome do serviço">
        </div>
  
        <div class="campo">
          <label>Descrição</label>
          <textarea placeholder="Digite a descrição do serviço"></textarea>
        </div>
  
        <div class="campo">
          <label>Valor</label>
          <input type="number" placeholder="0,00">
        </div>
  
        <div class="campo">
          <label>Duração (em minutos)</label>
          <input type="number" placeholder="Ex: 60">
        </div>
  
        <button type="button">Cadastrar serviço</button>
      </form>
    </div>
  
    <div class="lista-servicos">
      <h2>Serviços cadastrados</h2>
      <p>Nenhum serviço cadastrado ainda.</p>
    </div>
  
  </section>
