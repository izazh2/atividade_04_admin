<section class="clientes-admin">

    <div class="titulo">
      <h1>Gerenciamento de Clientes</h1>
      <p>Consulte e gerencie os clientes cadastrados na loja.</p>
    </div>
  
    <div class="lista-clientes">
      <h2>Clientes cadastrados</h2>
  
      <div class="campo">
        <label>Pesquisar cliente</label>
        <input
          type="text"
          placeholder="Digite o nome ou CPF do cliente">
      </div>
  
      <div class="tabela">
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>CPF</th>
              <th>E-mail</th>
              <th>Telefone</th>
              <th>Ações</th>
            </tr>
          </thead>
  
          <tbody>
            <tr>
              <td colspan="5">Nenhum cliente cadastrado ainda.</td>
            </tr>
          </tbody>
        </table>
      </div>
  
    </div>
  
  </section>
